<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Venta - Gestor Pro</title>
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <script src="../js/session.js"></script>
    <style>
        body { background-color: #12141d; color: white; }
        .container { background-color: #1e2132; padding: 35px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .form-label { color: #a855f7; font-weight: 500; }
        .form-control { background-color: #0d0e14; border: 1px solid #2d2f3f; color: white; }
        .form-control:focus { background-color: #0d0e14; color: white; border-color: #6366f1; box-shadow: none; }
        .btn-actualizar { 
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); /* Naranja profesional para edición */
            border: none; color: white; font-weight: 600; padding: 10px 30px;
        }
        .btn-secondary { background-color: #2d2f3f; border: none; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">✏️ Editar Registro de Venta</h2>
        <form id="editForm" class="row g-3">
            <input type="hidden" id="venta_id">
            
            <div class="col-md-6">
                <label class="form-label">Descripción</label>
                <input type="text" id="descripcion" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Cliente</label>
                <input type="text" id="cliente" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">DNI / RUC</label>
                <input type="text" id="dni" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label">Monto (S/)</label>
                <input type="number" step="0.01" id="monto" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Fecha</label>
                <input type="date" id="fecha" class="form-control" required>
            </div>
            
            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-actualizar me-2">Guardar Cambios</button>
                <a href="ver_ventas.html" class="btn btn-secondary">Volver al listado</a>
                <button type="button" id="logoutBtn" class="btn btn-outline-danger ms-2">Cerrar sesión</button>
            </div>
        </form>
    </div>

    <script src="../js/editar.js"></script>
</body>
</html>
