<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ranking de Clientes - Pro</title>
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <script src="../js/session.js"></script>
    <style>
        body { background-color: #12141d; color: white; }
        .navbar { background-color: #1a1c2c !important; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .card { background-color: #1e2132; border: none; border-radius: 12px; margin-bottom: 20px; }
        .card-header { border-bottom: 1px solid rgba(255,255,255,0.1); color: #a855f7; font-weight: bold; }
        .table { color: white; border-color: rgba(255,255,255,0.05); }
        .form-control { background-color: #0d0e14; border: 1px solid #2d2f3f; color: white; }
        .form-control:focus { background-color: #0d0e14; color: white; border-color: #6366f1; box-shadow: none; }
        .rank-1 { color: #ffd700; font-weight: bold; } /* Oro */
        .rank-2 { color: #c0c0c0; font-weight: bold; } /* Plata */
        .rank-3 { color: #cd7f32; font-weight: bold; } /* Bronce */
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <span class="navbar-brand text-info">Ranking de Ventas</span>
        <div class="d-flex">
            <a href="registrar_venta.html" class="btn btn-primary me-2">➕ Registrar Venta</a>
            <a href="dashboard.html" class="btn btn-outline-light me-2">Dashboard</a>
            <a href="ranking_clientes.html" class="btn btn-outline-light me-2 active">Ranking</a>
            <a href="ver_ventas.html" class="btn btn-outline-light me-2">Ver Ventas</a>
            <a href="#" id="logoutBtn" class="btn btn-outline-danger">Cerrar sesión</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">Top Clientes <small class="text-secondary fs-5">(Por volumen de compra)</small></h2>

    <div class="card shadow">
        <div class="card-body">
            <form id="rankingForm" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label text-secondary">Desde</label>
                    <input type="date" id="desde" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-secondary">Hasta</label>
                    <input type="date" id="hasta" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label text-secondary">Mostrar Top</label>
                    <input type="number" id="topLimit" class="form-control" value="20" min="1">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-success w-100">Analizar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="bg-black text-secondary">
                        <tr>
                            <th class="ps-4">#</th>
                            <th>Cliente</th>
                            <th>DNI/RUC</th>
                            <th>Ventas</th>
                            <th>Total Acumulado</th>
                            <th>Última Compra</th>
                        </tr>
                    </thead>
                    <tbody id="tablaRanking">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="../js/ranking_clientes.js"></script>
</body>
</html>
