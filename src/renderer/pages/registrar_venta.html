<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Venta - Gestor de Ventas</title>
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <script src="../js/session.js"></script>
    <style>
        body { background-color: #12141d; color: white; }
        .navbar { background-color: #1a1c2c !important; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .card { background-color: #1e2132; border: none; border-radius: 12px; }
        .card-header { border-bottom: 1px solid rgba(255,255,255,0.1); color: #a855f7; font-weight: bold; font-size: 1.2rem; }
        .form-control { background-color: #0d0e14; border: 1px solid #2d2f3f; color: white; }
        .form-control:focus { background-color: #0d0e14; color: white; border-color: #6366f1; box-shadow: none; }
        .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); border: none; font-weight: 600; }
        .btn-secondary { background-color: #2d2f3f; border: none; }
        label { color: #94a3b8; margin-bottom: 0.5rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <span class="navbar-brand">Gestor de Ventas</span>
        <div class="d-flex">
            <a href="registrar_venta.html" class="btn btn-primary me-2 active">➕ Registrar Venta</a>
            <a href="dashboard.html" class="btn btn-outline-light me-2">Dashboard</a>
            <a href="ranking_clientes.html" class="btn btn-outline-light me-2">Ranking</a>
            <a href="ver_ventas.html" class="btn btn-outline-light me-2">Ver Ventas</a>
            <a href="#" id="logoutBtn" class="btn btn-outline-danger">Cerrar sesión</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-header p-3 text-center">Nueva Venta de Contómetros</div>
                <div class="card-body p-4">
                    <form id="ventaForm">
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label class="form-label">Descripción del Producto</label>
                                <input type="text" id="descripcion" class="form-control" placeholder="Ej: Contómetro térmico 80x80" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Cliente / Razón Social</label>
                                <input type="text" id="cliente" class="form-control" placeholder="Nombre del cliente" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">DNI / RUC</label>
                                <input type="text" id="dni" class="form-control" placeholder="Opcional">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Monto de Venta (S/)</label>
                                <input type="number" step="0.01" id="monto" class="form-control" placeholder="0.00" required>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label">Fecha de Operación</label>
                                <input type="date" id="fecha" class="form-control" required>
                            </div>
                        </div>
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="dashboard.html" class="btn btn-secondary px-4">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-5">Guardar Registro</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../js/registrar_venta.js"></script>
</body>
</html>
